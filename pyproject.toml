[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["datasets", "log", ".superpowers"]

[tool.ruff.lint]
# Deliberately narrow: pyflakes correctness (F), pycodestyle errors (E),
# import sorting (I). Style-only and opinionated rules are out of scope —
# this repo optimizes for agent-behavior correctness, not lint surface.
select = ["E", "F", "I"]

# Per-file exemptions for patterns that are correct by design.
# E402: Module-level imports must follow sys.path bootstrap for local module discovery.
# E501 (long lines in system prompts): Wrapping would alter the exact text sent to the model.
[tool.ruff.lint.per-file-ignores]
"agent/setup_scoreboard.py" = ["E402"]
"agent/splunk_agent.py" = ["E501"]
"agent/v0/run_all_v0.py" = ["E402"]
"agent/v0/orchestrator.py" = ["E501"]
"agent/v0/sh_loop.py" = ["E501"]
"agent/v0/sh_memory.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["agent/v0/tests", "tests"]
