<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" role="img" aria-label="A question goes to SH, which spawns Senior workers that run SPL on Splunk. Their premises go to the evidence gate, a premise ledger plus a blind validator. If every load-bearing premise is verified the answer is submitted; otherwise the case escalates to a human analyst with an evidence package.">
  <rect width="1000" height="420" rx="12" fill="#020617"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Arrows first, so they sit behind the boxes -->
  <line x1="130" y1="150" x2="178" y2="150" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="330" y1="135" x2="398" y2="135" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="364" y="128" fill="#94a3b8" font-size="9" text-anchor="middle">spawn</text>
  <line x1="398" y1="165" x2="332" y2="165" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="364" y="180" fill="#94a3b8" font-size="9" text-anchor="middle">report</text>
  <line x1="440" y1="190" x2="440" y2="248" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="430" y="222" fill="#94a3b8" font-size="9" text-anchor="end">SPL</text>
  <line x1="510" y1="248" x2="510" y2="192" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="520" y="222" fill="#94a3b8" font-size="9" text-anchor="start">events</text>
  <line x1="550" y1="148" x2="623" y2="148" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="586" y="141" fill="#94a3b8" font-size="8" text-anchor="middle">premises</text>
  <line x1="705" y1="183" x2="705" y2="221" stroke="#fb7185" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="713" y="206" fill="#94a3b8" font-size="8" text-anchor="start">load-bearing</text>
  <polyline points="255,190 255,340 705,340 705,305" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="480" y="332" fill="#fb7185" font-size="8" text-anchor="middle">SH asks to ANSWER</text>
  <line x1="800" y1="130" x2="848" y2="130" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="824" y="123" fill="#22d3ee" font-size="8" text-anchor="middle">pass</text>
  <line x1="800" y1="260" x2="848" y2="260" stroke="#fb923c" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="824" y="253" fill="#fb923c" font-size="8" text-anchor="middle">fail</text>

  <!-- Evidence gate boundary -->
  <rect x="610" y="88" width="190" height="215" rx="8" fill="transparent" stroke="#fb7185" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="618" y="102" fill="#fb7185" font-size="8" text-anchor="start">EVIDENCE GATE</text>

  <!-- Components -->
  <rect x="30" y="120" width="100" height="60" rx="6" fill="#0f172a"/>
  <rect x="30" y="120" width="100" height="60" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="80.0" y="144" fill="white" font-size="11" font-weight="600" text-anchor="middle">Question</text>
  <text x="80.0" y="162" fill="#94a3b8" font-size="9" text-anchor="middle">BOTSv3 CTF</text>
  <rect x="180" y="110" width="150" height="80" rx="6" fill="#0f172a"/>
  <rect x="180" y="110" width="150" height="80" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="255.0" y="134" fill="white" font-size="11" font-weight="600" text-anchor="middle">SH</text>
  <text x="255.0" y="152" fill="#94a3b8" font-size="9" text-anchor="middle">orchestrator, GPT-5.4</text>
  <text x="255.0" y="166" fill="#94a3b8" font-size="9" text-anchor="middle">memory across questions</text>
  <rect x="400" y="110" width="150" height="80" rx="6" fill="#0f172a"/>
  <rect x="400" y="110" width="150" height="80" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="475.0" y="134" fill="white" font-size="11" font-weight="600" text-anchor="middle">Seniors</text>
  <text x="475.0" y="152" fill="#94a3b8" font-size="9" text-anchor="middle">GLM-5.3, up to 6</text>
  <text x="475.0" y="166" fill="#94a3b8" font-size="9" text-anchor="middle">parallel threads</text>
  <rect x="400" y="250" width="150" height="60" rx="6" fill="#0f172a"/>
  <rect x="400" y="250" width="150" height="60" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="475.0" y="274" fill="white" font-size="11" font-weight="600" text-anchor="middle">Splunk</text>
  <text x="475.0" y="292" fill="#94a3b8" font-size="9" text-anchor="middle">index=botsv3</text>
  <rect x="625" y="118" width="160" height="65" rx="6" fill="#0f172a"/>
  <rect x="625" y="118" width="160" height="65" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="705.0" y="142" fill="white" font-size="11" font-weight="600" text-anchor="middle">Premise ledger</text>
  <text x="705.0" y="160" fill="#94a3b8" font-size="9" text-anchor="middle">quote must appear in</text>
  <text x="705.0" y="174" fill="#94a3b8" font-size="9" text-anchor="middle">real tool output</text>
  <rect x="625" y="223" width="160" height="65" rx="6" fill="#0f172a"/>
  <rect x="625" y="223" width="160" height="65" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="705.0" y="247" fill="white" font-size="11" font-weight="600" text-anchor="middle">Blind validator</text>
  <text x="705.0" y="265" fill="#94a3b8" font-size="9" text-anchor="middle">re-checks load-bearing</text>
  <text x="705.0" y="279" fill="#94a3b8" font-size="9" text-anchor="middle">premises, no answer seen</text>
  <rect x="850" y="100" width="130" height="60" rx="6" fill="#0f172a"/>
  <rect x="850" y="100" width="130" height="60" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="915.0" y="124" fill="white" font-size="11" font-weight="600" text-anchor="middle">Answer submitted</text>
  <text x="915.0" y="142" fill="#94a3b8" font-size="9" text-anchor="middle">exact-match score</text>
  <rect x="850" y="230" width="130" height="60" rx="6" fill="#0f172a"/>
  <rect x="850" y="230" width="130" height="60" rx="6" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="915.0" y="254" fill="white" font-size="11" font-weight="600" text-anchor="middle">Escalate</text>
  <text x="915.0" y="272" fill="#94a3b8" font-size="9" text-anchor="middle">evidence package</text>
  <text x="915.0" y="286" fill="#94a3b8" font-size="9" text-anchor="middle">to a human analyst</text>

  <!-- Legend, below every boundary -->
  <text x="30" y="374" fill="white" font-size="10" font-weight="600" text-anchor="start">Legend</text>
  <rect x="30" y="385" width="16" height="10" rx="2" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="52" y="393" fill="#94a3b8" font-size="8" text-anchor="start">Agent</text>
  <rect x="110" y="385" width="16" height="10" rx="2" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"/>
  <text x="132" y="393" fill="#94a3b8" font-size="8" text-anchor="start">Data</text>
  <rect x="190" y="385" width="16" height="10" rx="2" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1"/>
  <text x="212" y="393" fill="#94a3b8" font-size="8" text-anchor="start">Evidence gate</text>
  <rect x="320" y="385" width="16" height="10" rx="2" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="342" y="393" fill="#94a3b8" font-size="8" text-anchor="start">Outcome</text>
  <rect x="420" y="385" width="16" height="10" rx="2" fill="rgba(251, 146, 60, 0.3)" stroke="#fb923c" stroke-width="1"/>
  <text x="442" y="393" fill="#94a3b8" font-size="8" text-anchor="start">Escalation</text>
  <rect x="530" y="385" width="16" height="10" rx="2" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1"/>
  <text x="552" y="393" fill="#94a3b8" font-size="8" text-anchor="start">Input</text>
  <line x1="610" y1="390" x2="626" y2="390" stroke="#fb7185" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="632" y="393" fill="#94a3b8" font-size="8" text-anchor="start">Answer request</text>
</svg>
