<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="t">An answer is only submitted if the evidence gate passes; otherwise the case escalates to an analyst</title>
  <desc id="d">A question goes to the SH orchestrator. SH spawns Senior workers that search Splunk and report back. Their premises and quoted tool output go to the evidence gate, which also receives SH's request to answer. If every load-bearing premise is verified the answer is submitted; if not, a package goes to a human analyst.</desc>
  <style>
    .ink { stroke: #24292f; }
    .txt { fill: #24292f; }
    .sub { fill: #57606a; }
    .box { fill: none; stroke-width: 1.6; }
    .edge { fill: none; stroke-width: 1.6; }
    .ok { stroke: #1a7f37; } .okt { fill: #1a7f37; } .okd { fill: #1a7f37; }
    .warn { stroke: #bf8700; } .warnt { fill: #9a6700; } .warnd { fill: #bf8700; }
    .head { fill: #24292f; }
    .gate { stroke-dasharray: 5 4; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #e6edf3; } .txt { fill: #e6edf3; } .sub { fill: #8b949e; } .head { fill: #e6edf3; }
      .ok { stroke: #3fb950; } .okt { fill: #3fb950; } .okd { fill: #3fb950; }
      .warn { stroke: #d29922; } .warnt { fill: #e3b341; } .warnd { fill: #d29922; }
    }
    @media (prefers-reduced-motion: reduce) { .dot { display: none; } }
    .lbl { font-size: 11px; } .name { font-size: 14px; font-weight: 600; } .small { font-size: 11px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="head"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="okd"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="warnd"/></marker>
  </defs>

  <!-- nodes -->
  <rect class="box ink" x="10" y="110" width="100" height="60" rx="8"/>
  <text class="name txt" x="60" y="136" text-anchor="middle">Question</text>
  <text class="small sub" x="60" y="154" text-anchor="middle">BOTSv3 CTF</text>

  <rect class="box ink" x="160" y="100" width="140" height="80" rx="8"/>
  <text class="name txt" x="230" y="132" text-anchor="middle">SH</text>
  <text class="small sub" x="230" y="150" text-anchor="middle">orchestrator</text>
  <text class="small sub" x="230" y="166" text-anchor="middle">memory across questions</text>

  <rect class="box ink" x="380" y="100" width="140" height="80" rx="8"/>
  <text class="name txt" x="450" y="132" text-anchor="middle">Seniors</text>
  <text class="small sub" x="450" y="150" text-anchor="middle">up to 6 in parallel</text>
  <text class="small sub" x="450" y="166" text-anchor="middle">run SPL on Splunk</text>

  <rect class="box ink gate" x="600" y="100" width="150" height="80" rx="8"/>
  <text class="name txt" x="675" y="132" text-anchor="middle">Evidence gate</text>
  <text class="small sub" x="675" y="150" text-anchor="middle">premise ledger</text>
  <text class="small sub" x="675" y="166" text-anchor="middle">+ blind validator</text>

  <rect class="box ok" x="830" y="50" width="160" height="70" rx="8"/>
  <text class="name okt" x="910" y="80" text-anchor="middle">Answer submitted</text>
  <text class="small sub" x="910" y="99" text-anchor="middle">exact-match scoreboard</text>

  <rect class="box warn" x="830" y="160" width="160" height="70" rx="8"/>
  <text class="name warnt" x="910" y="190" text-anchor="middle">Escalate to analyst</text>
  <text class="small sub" x="910" y="209" text-anchor="middle">evidence package</text>

  <!-- edges -->
  <line class="edge ink" x1="110" y1="140" x2="158" y2="140" marker-end="url(#a)"/>
  <line class="edge ink" x1="300" y1="125" x2="378" y2="125" marker-end="url(#a)"/>
  <text class="lbl sub" x="339" y="118" text-anchor="middle">spawn</text>
  <line class="edge ink" x1="378" y1="155" x2="302" y2="155" marker-end="url(#a)"/>
  <text class="lbl sub" x="339" y="172" text-anchor="middle">report</text>
  <line class="edge ink" x1="520" y1="140" x2="598" y2="140" marker-end="url(#a)"/>
  <text class="lbl sub" x="559" y="132" text-anchor="middle">premises</text>
  <polyline class="edge ink" points="230,180 230,262 675,262 675,182" marker-end="url(#a)"/>
  <text class="lbl sub" x="452" y="254" text-anchor="middle">SH asks to ANSWER</text>
  <polyline class="edge ok" points="750,125 790,125 790,85 828,85" marker-end="url(#g)"/>
  <text class="lbl okt" x="770" y="75" text-anchor="middle">pass</text>
  <polyline class="edge warn" points="750,155 790,155 790,195 828,195" marker-end="url(#w)"/>
  <text class="lbl warnt" x="770" y="213" text-anchor="middle">fail</text>

  <!-- motion: one question flowing through, then the two outcomes -->
  <circle class="dot okd" r="5" opacity="0">
    <animateMotion dur="7s" repeatCount="indefinite" keyTimes="0;1" path="M60,140 L450,140 L675,140 L790,125 L790,85 L910,85"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle class="dot warnd" r="5" opacity="0">
    <animateMotion dur="7s" begin="3.5s" repeatCount="indefinite" path="M60,140 L450,140 L675,140 L790,155 L790,195 L910,195"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="7s" begin="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
