name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # Tests import agent modules, so collection needs their runtime packages.
        run: pip install -r agent/requirements.txt pytest ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Leaderboard is in sync with the run artifacts
        run: python3 scripts/run_eval.py --check
